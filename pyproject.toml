[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domainroc-mcp-server"
version = "0.2.0"
description = "MCP assistant for DomainRoc domain search, account services and USDT recharge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "domain", "domainroc", "ai-agent", "domain-search", "usdt"]
dependencies = [
  "mcp>=1.28,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
domainroc-mcp = "domainroc_mcp.server:main"

[project.urls]
Homepage = "https://www.domainroc.com/en/ai-agent-domain-search"
Repository = "https://github.com/sinianchu9/domainroc-mcp-server"
Documentation = "https://github.com/sinianchu9/domainroc-mcp-server#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
